<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>FlixTV - TV</title>
<style>
/* Bố cục TV 16:9: khung cố định 1920x1080 tự co để vừa màn hình (720p, 1080p, 4K), chừa viền đen nếu tỉ lệ khác. Thêm ?lite vào địa chỉ để tắt hiệu ứng mờ trên TV yếu. */
:root{--bg:#0b0c10;--fg:#f6f7f9;--mute:rgba(240,243,250,.72);--accent:#0a7bff;--accent-ink:#ffffff;--grad:linear-gradient(90deg,#0a7bff,#00229a);--focus:#fff;
  --glass:rgba(255,255,255,.11);--line:rgba(255,255,255,.2);--sub:#1f5fd6;--tm:#26b560;
  --safe-x:80px;--safe-y:45px;--r1:1rem;--r2:1.4rem;--r3:2rem}
*{box-sizing:border-box}
html{font-size:21px;background:#000}
body{background:#000}
#app{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;background:var(--bg)}
html,body{margin:0;height:100%;color:var(--fg);font-family:-apple-system,"SF Pro Display","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:1rem;line-height:1.35;overflow:hidden;user-select:none;-webkit-user-select:none}
[tabindex]{outline:none}
.glass{background:var(--glass);border:1px solid var(--line);box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 .8rem 2.4rem rgba(0,0,0,.35);-webkit-backdrop-filter:blur(1.6rem) saturate(1.7);backdrop-filter:blur(1.6rem) saturate(1.7)}
.lite .glass{background:rgba(38,44,58,.92);-webkit-backdrop-filter:none;backdrop-filter:none}
.lite .hb,.lite .ibtn,.lite #clock,.lite .bd,.lite #rowsWrap,.lite .rb,.lite .pill,.lite .pb,.lite #pset,.lite #toast{-webkit-backdrop-filter:none;backdrop-filter:none}
.lite #rowsWrap{background:rgba(20,24,34,.85)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.glass{background:rgba(38,44,58,.92)}}

/* nền toàn màn hình */
#bg{position:fixed;inset:0;background:var(--bg) 70% center/cover no-repeat;opacity:var(--bgo,1);transition:opacity .35s}
#bg.fade{opacity:.15}
body[data-v=list]{--bgo:.28}
body[data-v=me]{--bgo:.2}
body[data-v=detail]{--bgo:.85}
#bgs{position:fixed;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(8,9,13,.94) 0%,rgba(8,9,13,.72) 34%,rgba(8,9,13,.15) 72%,transparent),linear-gradient(0deg,var(--bg) 6%,rgba(11,12,16,.7) 28%,transparent 58%),linear-gradient(180deg,rgba(8,9,13,.75),transparent 20%)}

/* thanh trên */
#bar{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;gap:.5rem;padding:var(--safe-y) var(--safe-x) 0;z-index:5}
.logo{display:flex;align-items:center;gap:.6rem;font-weight:800;font-size:1.6rem;margin-right:1.6rem;letter-spacing:.01em}
.logo svg{width:2.6rem;height:2.6rem}
.logo b{color:var(--accent)}
.nav{padding:.5rem 1.35rem;border-radius:3rem;color:#fff;cursor:pointer;white-space:nowrap;font-size:1.15rem;font-weight:700;text-shadow:0 1px 8px rgba(0,0,0,.7);transition:transform .12s}
.nav.on{color:var(--accent-ink);background:var(--grad);text-shadow:none}
.nav:focus,.btn:focus,.ep:focus,.key:focus,.ibtn:focus{background:#fff;color:#10131a;transform:scale(1.08);text-shadow:none}
.navpill{display:flex;align-items:center;gap:.3rem;padding:.35rem;border-radius:3rem}
.right{margin-left:auto;display:flex;align-items:center;gap:1.1rem}
.ibtn{width:2.9rem;height:2.9rem;border-radius:50%;background:var(--glass);border:1px solid var(--line);-webkit-backdrop-filter:blur(1.2rem) saturate(1.6);backdrop-filter:blur(1.2rem) saturate(1.6);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .12s}
.ibtn svg{width:55%;height:55%;fill:#fff}
.ibtn:focus svg{fill:none}
#clock{padding:.4rem 1.2rem;border-radius:3rem;background:var(--glass);border:1px solid var(--line);-webkit-backdrop-filter:blur(1.2rem) saturate(1.6);backdrop-filter:blur(1.2rem) saturate(1.6);font-size:1.3rem;font-weight:700;text-shadow:0 1px 8px rgba(0,0,0,.7);font-variant-numeric:tabular-nums}

.view{position:absolute;inset:6.4rem 0 0 0;overflow-y:auto;padding:.6rem var(--safe-x) 6rem;scrollbar-width:none;scroll-behavior:smooth}
.view::-webkit-scrollbar{display:none}
#home{inset:0;overflow:hidden;padding:0}

/* thông tin phim bên trái */
#hero{position:absolute;left:var(--safe-x);bottom:21.5rem;max-width:52%;padding:1.6rem 2.2rem 1.8rem;border-radius:2rem}
#h-t{font-size:2.9rem;font-weight:800;line-height:1.1;text-shadow:0 2px 14px rgba(0,0,0,.7)}
#h-o{margin-top:.5rem;font-size:1.3rem;color:var(--mute);font-weight:600}
#h-m{margin-top:.7rem;font-size:1.1rem;font-weight:700}
#h-g{margin-top:.7rem;display:flex;align-items:center;gap:.7rem;flex-wrap:wrap;font-size:1.05rem;color:var(--mute);font-weight:600;min-height:1.6rem}
#h-d{margin-top:.8rem;font-size:1.1rem;font-weight:600;color:#eef1f6;text-shadow:0 1px 8px rgba(0,0,0,.8);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;min-height:4.2em;max-width:46rem}
.hbtns{margin-top:1.1rem;display:flex;gap:1rem}
.hb{display:inline-flex;align-items:center;gap:.6rem;padding:.8rem 2.2rem;border-radius:.9rem;font-size:1.15rem;font-weight:700;cursor:pointer;transition:transform .12s,box-shadow .12s;background:rgba(255,255,255,.14);border:.1rem solid var(--line);-webkit-backdrop-filter:blur(1rem);backdrop-filter:blur(1rem);color:#fff}
.hb.main{background:var(--grad);color:var(--accent-ink);border-color:#0a7bff}
.hb:focus{transform:scale(1.07);box-shadow:0 0 0 .22rem #fff,0 .8rem 2rem rgba(0,0,0,.5)}
.hb.main:focus{background:linear-gradient(90deg,#3b94ff,#0a4fd6)}
.hb svg{width:1.2rem;height:1.2rem;fill:currentColor}

/* hàng thẻ ngang */
#rowsWrap{position:absolute;left:0;right:0;bottom:0;height:20rem;overflow-x:hidden;overflow-y:auto;scrollbar-width:none;overscroll-behavior:contain;scroll-snap-type:y proximity;scroll-behavior:smooth;background:rgba(255,255,255,.06);border-top:1px solid var(--line);border-radius:2.2rem 2.2rem 0 0;-webkit-backdrop-filter:blur(1.6rem) saturate(1.5);backdrop-filter:blur(1.6rem) saturate(1.5)}
#rowsWrap::-webkit-scrollbar{display:none}
.row{height:17.5rem;scroll-snap-align:start}
.track{overflow-x:auto!important;scrollbar-width:none;overscroll-behavior-x:contain}
.track::-webkit-scrollbar{display:none}
h2{font-size:1.35rem;margin:.4rem var(--safe-x) 0;font-weight:700;text-shadow:0 1px 8px rgba(0,0,0,.7)}
#list h2,#detail h2{margin-left:.3rem}
.track{position:relative;display:flex;gap:1.2rem;overflow:hidden;padding:1rem var(--safe-x) 1rem;scroll-behavior:smooth}
.card{flex:0 0 17rem;cursor:pointer}
.pw{position:relative;width:17rem;height:9.6rem;border-radius:var(--r2);overflow:hidden;background:#161a23;border:1px solid rgba(255,255,255,.14);transition:transform .15s,box-shadow .15s}
.p{width:100%;height:100%;object-fit:cover;display:block}
.bds{position:absolute;left:.6rem;bottom:.6rem;display:flex;gap:.3rem}
.bd{padding:.12rem .65rem;border-radius:.6rem;font-size:.95rem;font-weight:800;color:#fff;background:rgba(31,95,214,.6);border:1px solid rgba(255,255,255,.3);-webkit-backdrop-filter:blur(.8rem);backdrop-filter:blur(.8rem)}
.bd.tm{background:rgba(38,181,96,.6)}
#h-g .bds{position:static}
.ibtn svg{fill:none;stroke:#fff;stroke-width:2.4;stroke-linecap:round}
.ibtn:focus svg{stroke:#10131a}
.card:focus .pw{transform:scale(1.07);box-shadow:0 0 0 .22rem var(--focus),0 .9rem 2.2rem rgba(0,0,0,.65)}
.card{position:relative}
.rank{position:absolute;left:-.3rem;top:-1rem;font-size:3.4rem;font-weight:900;line-height:1;color:#fff;-webkit-text-stroke:.14rem #0a7bff;text-shadow:0 .2rem .8rem rgba(0,0,0,.7);pointer-events:none;z-index:2}
.card .t{margin:.7rem .3rem 0;font-size:1.05rem;font-weight:600;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.card:focus .t{color:var(--accent)}
.grp{flex:0 0 100%;font-size:1.15rem;font-weight:700;color:var(--mute);margin:.6rem .3rem .1rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,17rem);gap:1.6rem 1.3rem;padding:1rem .6rem;justify-content:start}

.btn{display:inline-block;padding:.75rem 1.9rem;border-radius:3rem;cursor:pointer;margin:0 .8rem .8rem 0;font-size:1.1rem;transition:transform .12s}
.eps{display:flex;flex-wrap:wrap;gap:.7rem;padding:.6rem}
.ep{padding:.6rem 1.1rem;min-width:4.4rem;text-align:center;border-radius:var(--r1);cursor:pointer;font-size:1.05rem;transition:transform .12s}
.ep.cur{background:var(--grad);color:var(--accent-ink);border-color:transparent;font-weight:700}
.ep.cur:focus{background:#fff;color:#10131a}
.dhero{max-width:56%;padding:2rem 2.4rem;border-radius:2rem;margin-top:1rem}
.dhero h1{margin:0;font-size:2.9rem;line-height:1.1;text-shadow:0 2px 14px rgba(0,0,0,.7)}
.dhero .desc{margin-top:.9rem;max-width:46rem;font-size:1.1rem;font-weight:600;color:#eef1f6;max-height:6.8em;overflow:hidden;text-shadow:0 1px 8px rgba(0,0,0,.8)}
#msg{padding:4rem;text-align:center;color:var(--mute);font-size:1.2rem}

/* bàn phím ảo */
#kb{position:fixed;inset:0;background:rgba(6,8,12,.72);-webkit-backdrop-filter:blur(2rem);backdrop-filter:blur(2rem);z-index:30;padding:calc(var(--safe-y) + 1rem) var(--safe-x);display:flex;flex-direction:column;align-items:center}
.lite #kb{background:rgba(6,8,12,.95);backdrop-filter:none}
#kbq{width:min(46rem,100%);min-height:3.8rem;padding:.8rem 1.6rem;border-radius:1.5rem;font-size:1.6rem;margin-bottom:1.4rem}
#kbq.empty{color:var(--mute)}
#keys{display:grid;grid-template-columns:repeat(10,4rem);gap:.55rem;margin-bottom:.55rem}
#acts{display:flex;gap:.6rem;flex-wrap:wrap;justify-content:center}
.key{height:3.4rem;display:flex;align-items:center;justify-content:center;border-radius:var(--r1);font-size:1.3rem;cursor:pointer;padding:0 1.4rem;transition:transform .1s}
#keys .key{padding:0}
.key.go{background:var(--grad);color:var(--accent-ink);font-weight:700;border-color:transparent}
.key.go:focus{background:#fff;color:#10131a}

/* trình phát: nền đen, nút xám phẳng, thanh tua xanh */
#player{position:fixed;inset:0;background:#000;z-index:20}
#player video,#player iframe{width:100%;height:100%;border:0;background:#000;object-fit:contain}
#top{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;gap:1.4rem;padding:var(--safe-y) var(--safe-x) 3.5rem;background:linear-gradient(rgba(0,0,0,.75),transparent);transition:opacity .25s,visibility .25s}
#ptl{min-width:0}
#ptitle{font-size:1.9rem;font-weight:700;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#pep{font-size:1.6rem;letter-spacing:.02em}
#top .pill{margin-left:auto}
#bot{position:absolute;left:0;right:0;bottom:0;padding:3.5rem var(--safe-x) var(--safe-y);background:linear-gradient(transparent,rgba(0,0,0,.8));transition:opacity .25s,visibility .25s}
.hide{opacity:0;visibility:hidden}
.rb,.pill,.pb{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.2);-webkit-backdrop-filter:blur(1.2rem);backdrop-filter:blur(1.2rem);color:#fff;cursor:pointer;transition:transform .12s,background .12s;flex:none}
.rb{width:4rem;height:4rem;border-radius:50%;display:flex;align-items:center;justify-content:center}
.rb svg{width:55%;height:55%;fill:none;stroke:#fff;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
.pill{padding:1rem 2.4rem;border-radius:3rem;font-weight:700;font-size:1.1rem;letter-spacing:.02em;white-space:nowrap}
.pb{width:5.4rem;height:5.4rem;border-radius:50%;display:flex;align-items:center;justify-content:center}
.pb svg{width:50%;height:50%;fill:#fff}
.rb:focus,.pill:focus,.pb:focus{background:#0a84ff;box-shadow:0 0 0 .2rem #fff;transform:scale(1.1)}
.pill.off{opacity:.35}
#barlab{display:flex;justify-content:space-between;font-size:1.7rem;font-weight:300;margin-bottom:.5rem;font-variant-numeric:tabular-nums}
#pbar{position:relative;height:1.1rem;background:#4a4a4a;cursor:pointer}
#pfill{height:100%;width:0;background:var(--grad)}
#pknob{position:absolute;top:50%;left:0;width:1.8rem;height:1.8rem;margin:-.9rem 0 0 -.9rem;border-radius:50%;background:#0a63e6;transition:transform .12s}
#pbar:focus #pknob{transform:scale(1.35);box-shadow:0 0 0 .2rem #fff}
#ctl{display:flex;align-items:center;justify-content:space-between;margin-top:1.2rem}
#cbtns{display:flex;align-items:center;gap:1.1rem}
#pset{position:absolute;top:calc(var(--safe-y) + 5.5rem);right:var(--safe-x);width:20rem;padding:1rem;border-radius:1.2rem;background:rgba(50,50,58,.6);border:1px solid rgba(255,255,255,.18);-webkit-backdrop-filter:blur(1.8rem) saturate(1.6);backdrop-filter:blur(1.8rem) saturate(1.6);display:flex;flex-direction:column;gap:.35rem;z-index:3}
#pset .sh{font-size:1rem;color:rgba(255,255,255,.55);text-transform:uppercase;letter-spacing:.06em;margin:.5rem .4rem .1rem}
.opt{padding:.7rem 1.1rem;border-radius:.7rem;font-size:1.1rem;cursor:pointer}
.opt.sel::after{content:"✓";float:right;color:#4da3ff}
.opt:focus{background:#0a84ff;color:#fff}
.opt:focus::after{color:#fff}
#toast{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);padding:1rem 2.2rem;border-radius:1.5rem;font-size:2rem;background:rgba(40,40,46,.55);border:1px solid rgba(255,255,255,.2);-webkit-backdrop-filter:blur(1.4rem);backdrop-filter:blur(1.4rem);transition:opacity .25s,visibility .25s;pointer-events:none}
#spin{position:absolute;left:50%;top:50%;width:4rem;height:4rem;margin:-2rem;border:.4rem solid rgba(255,255,255,.25);border-top-color:#0a84ff;border-radius:50%;animation:sp .9s linear infinite;pointer-events:none}
@keyframes sp{to{transform:rotate(360deg)}}
/* cá nhân, đăng nhập */
#abtn.has{border-color:transparent}
#abtn .ini svg{width:1.6rem;height:1.6rem}
#abtn .ini{display:flex}
#abtn.has:focus{background:#fff;color:#10131a}
.ini{font-weight:800;font-size:1.3rem}
.hb.fav svg{fill:none;stroke:currentColor;stroke-width:2.2}
.hb.fav.on svg{fill:#ff5470;stroke:#ff5470}
.mehead{display:flex;align-items:center;gap:2rem;padding:1.6rem 2rem;border-radius:2rem;margin-top:.8rem}
.bigav{width:6.4rem;height:6.4rem;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--grad);font-size:2.6rem;font-weight:800;flex:none}
.bigav svg{width:55%;height:55%}
#mename{font-size:2rem;font-weight:800}
#mesub{color:var(--mute);font-size:1.05rem;margin-top:.2rem;max-width:30rem}
.mebtns{margin-left:auto;display:flex;gap:.8rem;flex-wrap:wrap;justify-content:flex-end}
.mebtns .hb{padding:.7rem 1.6rem;font-size:1.05rem}
#me h2{display:flex;align-items:center;gap:1.2rem;margin:1.6rem .3rem 0}
#me h2 .ep{font-size:1rem;padding:.4rem 1rem;font-weight:600}
#me .track{padding:1rem .6rem}
.empty{color:var(--mute);font-size:1.1rem;padding:1.2rem .4rem}
#auth{position:fixed;inset:0;z-index:25;background:rgba(6,8,12,.7);-webkit-backdrop-filter:blur(1.8rem);backdrop-filter:blur(1.8rem);display:flex;align-items:center;justify-content:center}
.lite #auth{background:rgba(6,8,12,.95);backdrop-filter:none}
#apanel{width:46rem;padding:2rem 2.4rem 2.2rem;border-radius:2rem}
.atabs{display:flex;gap:.6rem;margin-bottom:1.4rem;flex-wrap:wrap}
.field{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:1rem 1.4rem;border-radius:1.1rem;margin-bottom:.8rem;cursor:pointer;font-size:1.2rem;transition:transform .12s}
.fl{color:var(--mute);flex:none}
.fv{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fv i{color:var(--mute);font-style:normal;font-weight:400}
.field:focus{background:rgba(255,255,255,.95);color:#10131a;transform:scale(1.03)}
.field:focus .fl,.field:focus .fv i{color:#555}
#aerr{min-height:1.6rem;color:#ff8a8a;font-size:1.05rem;margin-top:.6rem}
.ainfo{color:var(--mute);font-size:1.05rem;margin:.2rem 0 .9rem}
.ainfo b{color:#fff;font-size:1.3rem;letter-spacing:.2rem}
#abody .hb{margin-top:.4rem;margin-right:.8rem}
#gtoast{position:fixed;left:50%;bottom:calc(var(--safe-y) + 1rem);transform:translateX(-50%);padding:.8rem 1.8rem;border-radius:3rem;font-size:1.2rem;z-index:40;pointer-events:none}
.avgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:1.1rem;padding:.4rem}
.avimg{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block}
#abtn.has,#meav,.bigav{overflow:hidden}
#abtn .ini:has(.avimg),.bigav .ini:has(.avimg){width:100%;height:100%}
.avopt{aspect-ratio:1;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:2.2rem;font-weight:800;border:.2rem solid transparent;transition:transform .12s}
.avopt svg,.bigav svg,.ibtn.has svg{fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.avopt svg{width:55%;height:55%}
.avopt.sel{border-color:#fff}
.avopt:focus{box-shadow:0 0 0 .25rem #fff;transform:scale(1.12)}
.qrwrap{display:flex;gap:2rem;align-items:center}
.qrbox{background:#fff;padding:.9rem;border-radius:1.2rem;flex:none;line-height:0}
.qrbox svg{width:13.5rem;height:13.5rem;display:block}
.qrside .ainfo{margin:0 0 .8rem}
.qrmeta{color:var(--mute);font-size:.95rem;margin-top:.5rem}
.atabs .xbtn{margin-left:auto}
/* ===== Bản điện thoại (màn hình nhỏ, chạm) ===== */
#kbin{width:min(46rem,100%);padding:1rem 1.3rem;border-radius:1.2rem;border:1px solid var(--line);background:var(--glass);color:#fff;font:inherit;font-size:1.2rem;outline:none;margin-bottom:1rem}
#kbin:focus{border-color:#4da3ff}
.tvscan{width:100%;border-radius:1rem;margin-top:.8rem;background:#000;max-height:14rem;object-fit:cover}
/* ===== Điện thoại: kiểu ứng dụng xem phim (banner lớn, hàng poster dọc, thanh tab dưới) ===== */
.chev{display:none}
.playic{position:absolute;left:50%;top:50%;width:2.6rem;height:2.6rem;margin:-1.3rem;border-radius:50%;border:.14rem solid #fff;background:rgba(0,0,0,.28)}
.playic::after{content:"";position:absolute;left:55%;top:50%;transform:translate(-50%,-50%);border-left:.7rem solid #fff;border-top:.45rem solid transparent;border-bottom:.45rem solid transparent}
.prog{position:absolute;left:.6rem;right:.6rem;bottom:.45rem;height:.22rem;background:rgba(255,255,255,.3);border-radius:1rem;overflow:hidden}
.prog i{display:block;height:100%;background:#4da3ff}
#hdots{display:none}
#tabbar{display:none}
#hdots i{width:.45rem;height:.45rem;border-radius:1rem;background:rgba(255,255,255,.35);transition:width .2s}
#hdots i.on{width:1.3rem;background:#fff}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:.2rem;color:rgba(255,255,255,.6);font-size:.72rem;cursor:pointer;padding:.3rem 0;min-width:0}
.tab b{font-weight:600;white-space:nowrap}
.tab svg{width:1.7rem;height:1.7rem;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:#4da3ff}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div id="app">
<div id="bg"></div><div id="bgs"></div>
<div id="bar">
  <span class="logo"><svg viewBox="0 0 40 40"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a7bff"/><stop offset="1" stop-color="#00229a"/></linearGradient></defs><circle cx="20" cy="20" r="19" fill="url(#lg)"/><path d="M16 11v18l14-9z" fill="#ffffff"/></svg><span>Flix<b>TV</b></span></span>
  <div class="navpill glass">

function mobFull(){

function play(){

  store.set('last',{slug:M.slug,name:M.name,thumb:M.thumb_url||M.poster_url,bg:M.poster_url,ep:e.name,sv:SV,ei:EI});dirty=true;addHist(M,e.name);

  if(!e.link_m3u8){fallback();return;}

  if(window.Hls&&Hls.isSupported()){
    hls=new Hls({maxBufferLength:40,enableWorker:true});hls.loadSource(e.link_m3u8);hls.attachMedia(v);
    hls.on(Hls.Events.ERROR,(_,d)=>{if(d.fatal){if(d.type===Hls.ErrorTypes.NETWORK_ERROR)hls.startLoad();else fallback();}});
    v.play().catch(()=>{});

function stop(keep){
  const v=V(),emb=$('#emb');

function savePos(){const vv=V();if(vv.duration&&M){const l=getL('hist');if(l[0]&&l[0].slug===M.slug){l[0].pct=Math.round(vv.currentTime/vv.duration*100);setL('hist',l);}}const p=store.get('pos',{});p[pkey()]=V().currentTime;const k=Object.keys(p);if(k.length>200)delete p[k[0]];store.set('pos',p);}
function step(n){
  const t=EPS[SV].server_data.length,i=EI+n;if(i<0||i>=t){toast(n>0?'Đây là tập cuối':'Đây là tập đầu');return;}
  const a=document.activeElement,keep=inCtl()?a.dataset.act:null;
  EI=i;play();if(keep)focusCtl(keep);
}
function seek(dir,rep){
  const v=V();clearTimeout(seekT);const d=dir*(rep?30:10);seekAcc+=d;
  v.currentTime=Math.max(0,Math.min(v.duration||1e9,v.currentTime+d));updateBar();
  toast((seekAcc>0?'▶▶ +':'◀◀ ')+seekAcc+'s');hud();seekT=setTimeout(()=>seekAcc=0,1200);
}
function act(a){
  const v=V();
  if(a==='exit'){goBack();return;}
  if(a==='settings'){openSet();return;}
  if(a==='toggle'){v.paused?v.play():v.pause();}
  else if(a==='back')seek(-1,false);
  else if(a==='fwd')seek(1,false);
  else if(a==='prev')step(-1);
  else if(a==='next')step(1);
  hud();
}
function openSet(){
  const s=$('#pset'),sp=store.get('speed',1);
  const sv=EPS.length>1?'<div class="sh">Server</div>'+EPS.map((x,i)=>`<span class="opt${i===SV?' sel':''}" tabindex="0" data-set="sv" data-v="${i}">${esc(x.server_name)}</span>`).join(''):'';
  s.innerHTML=sv+'<div class="sh">Tốc độ phát</div>'+[0.75,1,1.25,1.5,2].map(x=>`<span class="opt${x===sp?' sel':''}" tabindex="0" data-set="sp" data-v="${x}">${x}x</span>`).join('');
  s.hidden=false;hud(true);(s.querySelector('[data-set=sp].sel')||s.querySelector('.opt')).focus({preventScroll:true});

function closeSet(){$('#pset').hidden=true;hud();focusCtl('settings');}
function pick(el){
  const x=el.dataset.v;
  if(el.dataset.set==='sp'){const n=+x;store.set('speed',n);applySpeed();$('#pset').querySelectorAll('[data-set=sp]').forEach(o=>o.classList.toggle('sel',o===el));toast(n+'x');}
  else{SV=+x;EI=Math.min(EI,EPS[SV].server_data.length-1);$('#pset').hidden=true;play();}
}
function settingsKey(e){
  const k=e.key,opts=[...$('#pset').querySelectorAll('.opt')],i=opts.indexOf(document.activeElement);
  if(isBack(e)||k==='Backspace'||k==='ArrowLeft'){e.preventDefault();closeSet();return;}
  if(k==='ArrowDown'){e.preventDefault();opts[Math.min(opts.length-1,i+1)].focus({preventScroll:true});}
  else if(k==='ArrowUp'){e.preventDefault();opts[Math.max(0,i-1)].focus({preventScroll:true});}
  else if(k==='Enter'||k===' '){e.preventDefault();pick(document.activeElement);}
}
function playerKey(e){
  if(!$('#pset').hidden){settingsKey(e);return;}
  const v=V(),k=e.key,a=document.activeElement,ctl=inCtl(),cur=ctl?a.dataset.act:null,onBar=cur==='bar';
  if(isBack(e)||k==='Backspace'){e.preventDefault();if(ctl)hideHud(true);else goBack();return;}
  if(k==='ArrowLeft'||k==='ArrowRight'){
    e.preventDefault();const d=k==='ArrowRight'?1:-1;
    if(ctl&&!onBar){const row=rowFor(cur),t=ctlEl(row[row.indexOf(cur)+d]);if(t)t.focus({preventScroll:true});hud();}
    else seek(d,e.repeat);
    return;
  }
  if(k==='ArrowUp'||k==='ArrowDown'){
    e.preventDefault();hud();
    if(!ctl){focusCtl('toggle');return;}
    const row=rowFor(cur);
    if(k==='ArrowUp'){if(row===R2)focusCtl('bar');else if(row===R1)focusCtl('exit');}
    else{if(row===R0)focusCtl('bar');else if(row===R1)focusCtl('toggle');}
    return;
  }
  if(k==='Enter'||k===' '||k==='MediaPlayPause'){
    e.preventDefault();
    if(ctl&&!onBar)act(cur);
    else{v.paused?v.play():v.pause();toast(v.paused?'❚❚':'▶');hud();}
    return;
  }
  if(k==='MediaPlay'){v.play();return;}
  if(k==='MediaPause'){v.pause();return;}
  if(k==='MediaTrackNext'){step(1);return;}
  if(k==='MediaTrackPrevious'){step(-1);return;}

function kbKey(k,raw){
  if(k==='DEL')kq=kq.slice(0,-1);
  else if(k==='SPACE'){if(kbO.numeric||!kbO.spaces)return;if(kq&&!kq.endsWith(' '))kq+=' ';}
  else if(k==='CAPS'){caps=!caps;kbBuild();const c=$('#acts [data-k="CAPS"]');if(c)c.focus({preventScroll:true});return;}
  else if(k==='CLOSE'){kbClose();return;}
  else if(k==='GO'){if(NKB())kq=$('#kbin').value;const v=kq,o=kbO;kbClose();if(o.done)o.done(v);return;}
  else{
    let ch=raw?k:(/[A-Z]/.test(k)&&!caps?k.toLowerCase():k);
    if(kbO.numeric&&!/[0-9]/.test(ch))return;
    if(kbO.max&&kq.length>=kbO.max)return;

  }

}

async function sha(str){
  if(window.crypto&&crypto.subtle&&window.TextEncoder){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(str));return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('');}
  let h=2166136261;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619);}return 'f'+(h>>>0).toString(16);
}

function qrSvg(text){
  const q=new QRLib.QRCode(-1,QRLib.M);q.addData(text);q.make();
  const n=q.getModuleCount(),m=q.modules;let d='';
  for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(m[r][c])d+='M'+c+' '+r+'h1v1h-1z';
  return `<svg viewBox="0 0 ${n} ${n}" shape-rendering="crispEdges"><path d="${d}" fill="#000"/></svg>`;
}

  const token=Array.from(b).map(x=>x.toString(16).padStart(2,'0')).join('');
  QRS={token:token,exp:Date.now()+180000,timer:setInterval(qrTick,2000)};
  QRS.url=AUTH_API?AUTH_API+'/qr/approve?token='+token:'flixtv-demo://login?token='+token;

    v.className='tvscan';v.srcObject=st;v.setAttribute('playsinline','');v.muted=true;await v.play();$('#tvcam').appendChild(v);
    const det=new BarcodeDetector({formats:['qr_code']});
    TVS={st:st,t:setInterval(async()=>{try{const r=await det.detect(v);if(r.length){const k=tvToken(r[0].rawValue);if(k){tvScanStop();tvGo(k,err);}}}catch(e){}},500)};
  }catch(e){err('Không mở được camera. Hãy nhập mã trên TV.');}
}
function savePhoto(v){
  const us=users();if(!ME||!us[ME])return;us[ME].photo=v;store.set('users',us);
  updateAvatar();if(curView()==='me')renderMe();closeAuth();msg('Đã đổi ảnh đại diện');
}
function pickPhoto(err){
  const inp=document.createElement('input');inp.type='file';inp.accept='image/*';
  inp.onchange=()=>{
    const f=inp.files&&inp.files[0];if(!f)return;
    const rd=new FileReader();
    rd.onerror=()=>err('Không đọc được ảnh.');
    rd.onload=()=>{
      const im=new Image();
      im.onerror=()=>err('Tệp này không phải ảnh hợp lệ.');
      im.onload=()=>{
        const S=256,c=document.createElement('canvas');c.width=c.height=S;
        const m=Math.min(im.width,im.height),sx=(im.width-m)/2,sy=(im.height-m)/2;
        c.getContext('2d').drawImage(im,sx,sy,m,m,0,0,S,S);
        savePhoto(c.toDataURL('image/jpeg',.85));
      };
      im.src=rd.result;
    };
    rd.readAsDataURL(f);
  };
  inp.click();
}
async function authSubmit(a){
  const err=t=>{$('#aerr').textContent=t;};
  if(a==='avphoto')return pickPhoto(err);
  if(a==='avclear'){const us=users();if(ME&&us[ME]){delete us[ME].photo;store.set('users',us);updateAvatar();if(curView()==='me')renderMe();closeAuth();msg('Đã xóa ảnh');}return;}
  if(a==='avurl')return kbOpen({title:'Dán link ảnh (https://...)',max:400,go:'Xong',done:v=>{v=String(v||'').trim();if(!v)return;if(!/^https?:\/\/\S+$/i.test(v))return err('Link ảnh phải bắt đầu bằng http:// hoặc https://');savePhoto(v);}});
  if(a==='tvgo'){const k=tvToken(F.tvcode);if(!k)return err('Mã chưa đúng. Nhập đủ 24 ký tự hiện trên TV.');return tvGo(k,err);}
  if(a==='tvscan')return tvScan(err);
  const user=String(F.user||'').trim().toLowerCase();
  if(a==='login'){
    if(!user)return err('Hãy nhập tên đăng nhập.');
    if(!F.pass)return err('Hãy nhập mật khẩu.');
    const u=users()[user];
    if(!u||!u.hash||u.hash!==await sha(u.salt+F.pass))return err('Sai tên đăng nhập hoặc mật khẩu.');
    return signIn(user);
  }
  if(a==='register'){
    if(!(F.name||'').trim())return err('Hãy nhập tên hiển thị.');
    if(!UN.test(user))return err('Tên đăng nhập gồm 3 đến 20 ký tự: chữ, số, dấu chấm hoặc gạch dưới.');
    if((F.pass||'').length<6)return err('Mật khẩu cần ít nhất 6 ký tự.');
    if(F.pass!==F.pass2)return err('Hai mật khẩu chưa khớp.');
    const us=users();if(us[user])return err('Tên đăng nhập này đã có người dùng.');
    const salt=Math.random().toString(36).slice(2)+Date.now().toString(36);
    us[user]={name:F.name.trim(),salt:salt,hash:await sha(salt+F.pass)};store.set('users',us);mergeGuest(user);
    return signIn(user);
  }
}

/* ---------- định tuyến hành động ---------- */
function goBack(){
  if(!$('#kb').hidden){kbClose();return;}
  if(!$('#auth').hidden){closeAuth();return;}
  if(!$('#player').hidden){stop();renderDetail();return;}
  const v=curView();
  if(v==='detail'){
    const p=stack.pop()||{v:'home'};show(p.v);
    if(p.v==='home'){
      const sl=p.el&&p.el.dataset&&p.el.dataset.slug;
      if(dirty)renderRows();
      let t=p.el&&p.el.isConnected?p.el:(sl&&$('#rows .card[data-slug="'+(window.CSS&&CSS.escape?CSS.escape(sl):sl)+'"]'))||$('[data-h="play"]');
      t.focus({preventScroll:true});if(t.classList.contains('card')){ensureVisible(t);heroFill(t);}
    }else if(p.v==='me'){const sl=p.el&&p.el.dataset&&p.el.dataset.slug;renderMe();const t=(sl&&$('#me .card[data-slug="'+(window.CSS&&CSS.escape?CSS.escape(sl):sl)+'"]'))||$('#me [tabindex]');if(t)t.focus({preventScroll:true});}else if(p.el&&p.el.isConnected)p.el.focus({preventScroll:true});else focusFirst($('#'+p.v));
    return;
  }
  if(v==='list'||v==='me'){loadHome(true);}
}
function route(el){
  if(el.dataset.k!==undefined){kbKey(el.dataset.k);return true;}
  if(el.id==='sbtn'){openSearch();return true;}
  if(el.id==='abtn'){openMe();return true;}
  if(el.dataset.m!==undefined){meAction(el.dataset.m);return true;}
  if(el.id==='clrhist'){setL('hist',[]);renderMe();msg('Đã xóa lịch sử xem');const f=$('#me [tabindex]');if(f)f.focus({preventScroll:true});return true;}
  if(el.dataset.aclose!==undefined){closeAuth();return true;}
  if(el.dataset.av!==undefined){setAvatar(+el.dataset.av);return true;}
  if(el.dataset.qr!==undefined){qrStart();renderAuth('#abody [tabindex]');return true;}
  if(el.dataset.am!==undefined){authMode(el.dataset.am);return true;}
  if(el.dataset.fld!==undefined){editField(el.dataset.fld);return true;}
  if(el.dataset.asub==='qrnew'){qrStart();renderAuth('[data-asub="qrnew"]');return true;}
  if(el.dataset.asub==='qrdemo'){if(QRS)qrFinish('qr'+QRS.token.slice(0,8),'Khách QR');return true;}
  if(el.dataset.asub!==undefined){authSubmit(el.dataset.asub);return true;}
  if(el.id==='favbtn'){toggleFav(M.slug,M);return true;}
  if(el.dataset.h==='fav'){if(heroSlug)toggleFav(heroSlug);return true;}
  if(el.dataset.h==='play'){if(heroSlug)openDetail(heroSlug,true);return true;}
  if(el.dataset.h==='info'){if(heroSlug)openDetail(heroSlug);return true;}
  if(el.dataset.go){stack.length=0;if(el.dataset.go==='home')loadHome(false);else if(el.dataset.go==='the-loai')loadGenre('',false,'the-loai');else loadList(el.dataset.go);return true;}
  if(el.dataset.genre!==undefined){loadGenre(el.dataset.genre,false,el.dataset.ct);return true;}
  if(el.classList.contains('card')){openDetail(el.dataset.slug);return true;}
  if(el.dataset.set!==undefined){pick(el);return true;}
  if(el.dataset.act!==undefined){if(el.dataset.act!=='bar')act(el.dataset.act);return true;}
  if(el.dataset.cf!==undefined){loadList('hoat-hinh','',false,el.dataset.cf);return true;}
  if(el.dataset.rowgo!==undefined){const g=el.dataset.rowgo.split(':');stack.length=0;if(g[1])loadGenre(g[1],false,g[0]);else loadList(g[0]);return true;}
  if(el.dataset.tab==='me'){openMe();return true;}
  if(el.id==='more'){if(L.kind==='genre')loadGenre(L.slug,true,L.type);else loadList(L.kind,L.q,true);return true;}
  if(el.id==='playbtn'){play();return true;}
  if(el.id==='backbtn'){goBack();return true;}
  if(el.dataset.sv!==undefined){SV=+el.dataset.sv;EI=0;renderDetail();return true;}
  if(el.dataset.ei!==undefined){EI=+el.dataset.ei;play();return true;}
  return false;
}
document.addEventListener('wheel',e=>{
  if(MOBILE)return;
  const h=$('#home');if(h.hidden||!$('#player').hidden||!$('#kb').hidden||!$('#auth').hidden)return;
  const w=$('#rowsWrap');if(w.contains(e.target))return;

},{passive:true});
document.addEventListener('click',e=>{const t=e.target.closest('[tabindex]');if(t)route(t);});

/* ---------- điều hướng bằng remote ---------- */
function focusables(){
  if(!$('#kb').hidden)return[...document.querySelectorAll('#kb [tabindex]')];
  if(!$('#auth').hidden)return[...document.querySelectorAll('#auth [tabindex]')];
  return[...document.querySelectorAll('#bar [tabindex], .view:not([hidden]) [tabindex]')].filter(e=>e.offsetParent!==null);
}
function move(dir){
  const cur=document.activeElement,list=focusables(),home=!$('#home').hidden;
  if(!cur||!list.includes(cur)){const f=(home&&$('[data-h="play"]'))||list[0];if(f)f.focus({preventScroll:true});return;}
  if(home){
    if(cur.classList.contains('card')&&dir==='ArrowUp'&&cur.closest('.row')&&cur.closest('.row').dataset.i==='0'){$('[data-h="play"]').focus({preventScroll:true});return;}
    if(cur.dataset.h!==undefined&&dir==='ArrowDown'){const t=(lastCard&&lastCard.isConnected)?lastCard:$('#rows .card');if(t){t.focus({preventScroll:true});ensureVisible(t);}return;}
  }
  const c=cur.getBoundingClientRect(),cx=c.left+c.width/2,horiz=dir==='ArrowLeft'||dir==='ArrowRight';
  let best=null,bs=1e9;
  for(const e of list){
    if(e===cur)continue;
    const r=e.getBoundingClientRect(),x=r.left+r.width/2,dx=x-cx,dy=(r.top+r.height/2)-(c.top+c.height/2);
    let p,s;
    if(horiz){if(Math.abs(dy)>Math.max(c.height,r.height)*.6)continue;p=dir==='ArrowRight'?dx:-dx;if(p<=4)continue;s=Math.abs(dy);}
    else{
      if(r.right<0||r.left>innerWidth)continue;
      p=dir==='ArrowDown'?dy:-dy;if(p<=4)continue;s=Math.abs(dx);
    }
    const sc=p+s*3;if(sc<bs){bs=sc;best=e;}
  }
  if(!best)return;
  best.focus({preventScroll:true});
  if(home){if(best.classList.contains('card')&&best.closest('#rows'))ensureVisible(best);}
  else if(best.closest('#bar')){const vv=curView();if(vv)$('#'+vv).scrollTop=0;}
  else best.scrollIntoView({block:'center',inline:'nearest'});
}
const isBack=e=>e.key==='Escape'||e.key==='BrowserBack'||e.key==='GoBack'||e.key==='XF86Back'||e.keyCode===10009||e.keyCode===461||e.keyCode===27;
document.addEventListener('keydown',e=>{
  if(!$('#player').hidden){playerKey(e);return;}
  if(!$('#kb').hidden&&NKB()&&e.target&&e.target.id==='kbin'){
    if(e.key==='ArrowDown'&&!MOBILE){e.preventDefault();const g=$('#acts [data-k="GO"]');if(g)g.focus({preventScroll:true});return;}
    if(e.key==='ArrowUp'||e.key==='ArrowDown'){if(!MOBILE){e.preventDefault();move(e.key);}return;}
    if(e.key==='Enter'){if(MOBILE){e.preventDefault();kbKey('GO');}return;}
    if(isBack(e)){e.preventDefault();kbClose();}
    return;
  }
  if(!$('#kb').hidden){
    if(e.key==='Escape'){e.preventDefault();kbClose();return;}
    if(e.key==='Backspace'){e.preventDefault();kbKey('DEL');return;}
    if(e.key.length===1&&/[a-z0-9 .@_!\-]/i.test(e.key)&&!e.ctrlKey&&!e.metaKey){e.preventDefault();kbKey(e.key===' '?'SPACE':e.key,true);return;}
  }
  if((e.key==='f'||e.key==='F')&&$('#kb').hidden&&$('#auth').hidden){toggleFs();return;}
  if(e.key.startsWith('Arrow')){e.preventDefault();move(e.key);}
  else if(e.key==='Enter'){const t=document.activeElement;if(t&&t.hasAttribute&&t.hasAttribute('tabindex')){e.preventDefault();route(t);}}
  else if(isBack(e)||e.key==='Backspace'){e.preventDefault();goBack();}
});
updateAvatar();updateFavUI();(function(){const f=()=>document.body.classList.toggle('sc',Math.max($('#home').scrollTop,$('#list').scrollTop,$('#detail').scrollTop,$('#me').scrollTop)>180);['home','list','detail','me'].forEach(id=>$('#'+id).addEventListener('scroll',f,{passive:true}));})();
loadHome(true);
