<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FlixTV</title>
<style>
/* Giao diện kính mờ bo tròn kiểu iOS, bố cục banner + hàng phim như app xem phim di động.
   1rem = 1.0417vw (20px ở 1920px) nên tự co giãn 720p / 1080p / 4K. Thêm ?lite vào địa chỉ để tắt hiệu ứng mờ trên TV yếu. */
:root{--bg:#090b10;--fg:#f5f7fa;--mute:rgba(235,240,250,.62);--accent:#14d35f;--accent-ink:#03200d;--focus:#fff;
  --glass:rgba(255,255,255,.11);--glass-hi:rgba(255,255,255,.2);--line:rgba(255,255,255,.2);
  --safe-x:4vw;--safe-y:4vh;--r1:1rem;--r2:1.5rem;--r3:2.2rem}
*{box-sizing:border-box}
html{font-size:max(10px,1.0417vw);background:var(--bg)}
html,body{margin:0;height:100%;color:var(--fg);font-family:-apple-system,"SF Pro Display","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:1rem;line-height:1.35;overflow:hidden}
[tabindex]{outline:none}
.glass{background:var(--glass);border:1px solid var(--line);box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 .8rem 2.4rem rgba(0,0,0,.35);-webkit-backdrop-filter:blur(1.6rem) saturate(1.7);backdrop-filter:blur(1.6rem) saturate(1.7)}
.lite .glass{background:rgba(38,44,58,.92);-webkit-backdrop-filter:none;backdrop-filter:none}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.glass{background:rgba(38,44,58,.92)}}

#bg{position:fixed;inset:-6%;background:var(--bg) center/cover no-repeat;opacity:.6;filter:blur(2.6rem) saturate(1.5);transform:translateZ(0);transition:opacity .4s}
.lite #bg{filter:none;opacity:.3}
#bgs{position:fixed;inset:0;background:radial-gradient(120% 80% at 50% 0%,transparent,rgba(9,11,16,.75)),linear-gradient(0deg,var(--bg) 6%,transparent 55%)}

/* thanh trên */
#bar{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;gap:1rem;padding:var(--safe-y) var(--safe-x) 0;z-index:5}
.pill{display:flex;align-items:center;gap:.35rem;padding:.4rem .5rem .4rem 1.3rem;border-radius:3rem}
.logo{font-weight:800;font-size:1.5rem;color:var(--accent);margin-right:.9rem;letter-spacing:.02em}
.nav{padding:.5rem 1.2rem;border-radius:3rem;color:var(--mute);cursor:pointer;white-space:nowrap;font-size:1.05rem;transition:transform .12s,background .12s}
.nav.on{color:var(--accent-ink);background:var(--accent);font-weight:700}
#sbtn{margin-left:auto;padding:.7rem 1.5rem;border-radius:3rem;color:var(--fg)}
.nav:focus{background:rgba(255,255,255,.94);color:#10131a;transform:scale(1.07);font-weight:700}
.btn:focus,.ep:focus,.key:focus{background:rgba(255,255,255,.95);color:#10131a;transform:scale(1.07);font-weight:700}

.view{position:absolute;inset:6.4rem 0 0 0;overflow-y:auto;padding:.6rem var(--safe-x) 6rem;scrollbar-width:none;scroll-behavior:smooth}
.view::-webkit-scrollbar{display:none}

/* banner nổi bật */
.banner{position:relative;height:20rem;border-radius:var(--r3);overflow:hidden;cursor:pointer;background:#141821;transition:transform .16s,box-shadow .16s;margin:.4rem .3rem 0}
.banner:focus{transform:scale(1.012);box-shadow:0 0 0 .22rem var(--focus),0 1rem 3rem rgba(0,0,0,.6)}
#bimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .5s}
.banner::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(8,10,14,.92) 4%,rgba(8,10,14,.35) 55%,transparent),linear-gradient(0deg,rgba(8,10,14,.7),transparent 45%)}
.binfo{position:absolute;left:2.4rem;bottom:2rem;z-index:2;max-width:55%}
.tags{display:flex;gap:.5rem;margin-bottom:.8rem;flex-wrap:wrap}
.tag{padding:.25rem .8rem;border-radius:2rem;font-size:.85rem}
#btitle{font-size:2.6rem;font-weight:800;line-height:1.1;text-shadow:0 2px 14px rgba(0,0,0,.6)}
#bmeta{margin-top:.5rem;color:var(--mute);font-size:1.05rem}
.cta{display:inline-block;margin-top:1rem;padding:.65rem 1.8rem;border-radius:3rem;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:1.05rem}
.dots{position:absolute;right:2rem;bottom:1.8rem;z-index:2;display:flex;gap:.5rem;padding:.5rem .8rem;border-radius:2rem}
.dot{width:.5rem;height:.5rem;border-radius:1rem;background:rgba(255,255,255,.4);transition:width .25s,background .25s}
.dot.on{width:1.6rem;background:var(--accent)}

h2{font-size:1.5rem;margin:1.5rem .3rem .2rem;font-weight:700;display:flex;align-items:center;gap:.7rem}
h2::before{content:"";width:.28rem;height:1.2rem;border-radius:1rem;background:var(--accent)}
.track{display:flex;gap:1.3rem;overflow:hidden;padding:1rem .6rem 1.1rem;scroll-behavior:smooth}
.card{flex:0 0 11rem;cursor:pointer;scroll-margin:0 3rem}
.pw{position:relative;width:11rem;height:16rem;border-radius:var(--r2);overflow:hidden;background:#161a23;transition:transform .15s,box-shadow .15s}
.p{width:100%;height:100%;object-fit:cover;display:block}
.chip{position:absolute;left:.5rem;bottom:.5rem;padding:.2rem .7rem;border-radius:2rem;font-size:.8rem;font-weight:600}
.qb{position:absolute;right:.5rem;top:.5rem;padding:.15rem .6rem;border-radius:.7rem;font-size:.75rem;font-weight:800;background:var(--accent);color:var(--accent-ink)}
.card:focus .pw{transform:scale(1.09);box-shadow:0 0 0 .22rem var(--focus),0 .9rem 2.2rem rgba(0,0,0,.65)}
.card .t{margin:.65rem .2rem 0;font-size:1rem;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.card .y{margin-left:.2rem;font-size:.85rem;color:var(--mute)}
.card:focus .t{color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,11rem);gap:1.6rem 1.3rem;padding:1rem .6rem;justify-content:start}
.grid .card{scroll-margin:6rem 0}

.btn{display:inline-block;padding:.75rem 1.9rem;border-radius:3rem;cursor:pointer;margin:0 .8rem .8rem 0;font-size:1.1rem;transition:transform .12s}
.btn.main{background:var(--accent);color:var(--accent-ink);font-weight:700;border-color:transparent}
.btn.main:focus{background:#fff}
.panel{display:flex;gap:2.2rem;padding:1.6rem;border-radius:var(--r3);margin-top:.6rem}
.panel img{width:13rem;height:19rem;object-fit:cover;border-radius:var(--r2);flex:none;background:#161a23}
.panel h1{margin:0 0 .3rem;font-size:2.4rem;line-height:1.1}
.meta{color:var(--mute);margin-bottom:.8rem;font-size:1.05rem}
.desc{max-width:50rem;color:#dfe4ee;font-size:1.05rem;max-height:6.4em;overflow:hidden}
.eps{display:flex;flex-wrap:wrap;gap:.7rem;padding:.6rem}
.ep{padding:.6rem 1.1rem;min-width:4.4rem;text-align:center;border-radius:var(--r1);cursor:pointer;font-size:1.05rem;transition:transform .12s}
.ep.cur{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-weight:700}
.ep.cur:focus{background:#fff}
#msg{padding:4rem;text-align:center;color:var(--mute);font-size:1.2rem}

/* bàn phím ảo */
#kb{position:fixed;inset:0;background:rgba(6,8,12,.72);-webkit-backdrop-filter:blur(2rem);backdrop-filter:blur(2rem);z-index:30;padding:calc(var(--safe-y) + 1rem) var(--safe-x);display:flex;flex-direction:column;align-items:center}
.lite #kb{background:rgba(6,8,12,.95);backdrop-filter:none}
#kbq{width:min(46rem,100%);min-height:3.8rem;padding:.8rem 1.6rem;border-radius:var(--r2);font-size:1.6rem;margin-bottom:1.4rem}
#kbq.empty{color:var(--mute)}
#keys{display:grid;grid-template-columns:repeat(10,4rem);gap:.55rem;margin-bottom:.55rem}
#acts{display:flex;gap:.6rem;flex-wrap:wrap;justify-content:center}
.key{height:3.4rem;display:flex;align-items:center;justify-content:center;border-radius:var(--r1);font-size:1.3rem;cursor:pointer;padding:0 1.4rem;transition:transform .1s}
#keys .key{padding:0}
.key.go{background:var(--accent);color:var(--accent-ink);font-weight:700;border-color:transparent}
.key.go:focus{background:#fff}

/* trình phát */
#player{position:fixed;inset:0;background:#000;z-index:20}
#player video,#player iframe{width:100%;height:100%;border:0;background:#000;object-fit:contain}
#top{position:absolute;top:var(--safe-y);left:var(--safe-x);padding:.7rem 1.6rem;border-radius:3rem;font-size:1.4rem;transition:opacity .25s;pointer-events:none;max-width:80%}
#bot{position:absolute;left:var(--safe-x);right:var(--safe-x);bottom:var(--safe-y);padding:1.2rem 1.8rem;border-radius:var(--r3);transition:opacity .25s;pointer-events:none}
.hide{opacity:0}
#pbar{height:.5rem;border-radius:1rem;background:rgba(255,255,255,.25);overflow:hidden}
#pfill{height:100%;width:0;background:var(--accent);border-radius:1rem}
#pinfo{display:flex;justify-content:space-between;margin-top:.7rem;font-size:1.1rem}
#phint{color:var(--mute);font-size:.9rem;margin-top:.3rem}
#toast{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);padding:1rem 2.2rem;border-radius:var(--r2);font-size:2rem;transition:opacity .25s;pointer-events:none}
#spin{position:absolute;left:50%;top:50%;width:4rem;height:4rem;margin:-2rem;border:.4rem solid rgba(255,255,255,.25);border-top-color:var(--accent);border-radius:50%;animation:sp .9s linear infinite;pointer-events:none}
@keyframes sp{to{transform:rotate(360deg)}}
[hidden]{display:none!important}
@media (max-width:900px){html{font-size:14px}.panel{flex-direction:column}.binfo{max-width:90%}#keys{grid-template-columns:repeat(8,3rem)}#bar{flex-wrap:wrap}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div id="bg"></div><div id="bgs"></div>
<div id="bar">
  <div class="pill glass">
    <span class="logo">FlixTV</span>
    <span class="nav on" tabindex="0" data-go="home">Trang chủ</span>
    <span class="nav" tabindex="0" data-go="phim-bo">Phim bộ</span>
    <span class="nav" tabindex="0" data-go="phim-le">Phim lẻ</span>
    <span class="nav" tabindex="0" data-go="hoat-hinh">Hoạt hình</span>
    <span class="nav" tabindex="0" data-go="tv-shows">TV Shows</span>
  </div>
  <span class="nav glass" tabindex="0" id="sbtn">Tìm kiếm</span>
</div>

<div id="home" class="view">
  <div id="banner" class="banner" tabindex="0" data-r="b" hidden>
    <img id="bimg" alt="">
    <div class="binfo">
      <div class="tags" id="btags"></div>
      <div id="btitle"></div><div id="bmeta"></div>
      <span class="cta">▶ Xem ngay</span>
    </div>
    <div class="dots glass" id="dots"></div>
  </div>
  <div id="cont"></div><div id="rows"></div>
</div>
<div id="list" class="view" hidden>
  <h2 id="lt"></h2><div id="chips" class="eps"></div><div id="grid" class="grid"></div>
  <div style="padding:1.4rem .6rem"><span id="more" class="btn glass" tabindex="0" hidden>Xem thêm</span></div>
</div>
<div id="detail" class="view" hidden></div>

<div id="kb" hidden>
  <div id="kbq" class="glass empty">Nhập tên phim...</div>
  <div id="keys"></div>
  <div id="acts">
    <span class="key glass" tabindex="0" data-k="SPACE">Dấu cách</span>
    <span class="key glass" tabindex="0" data-k="DEL">Xóa</span>
    <span class="key go" tabindex="0" data-k="GO">Tìm</span>
    <span class="key glass" tabindex="0" data-k="CLOSE">Đóng</span>
  </div>
</div>

<div id="player" hidden>
  <video id="v" playsinline></video>
  <iframe id="emb" hidden allowfullscreen allow="autoplay; fullscreen"></iframe>
  <div id="spin" hidden></div>
  <div id="toast" class="glass hide"></div>
  <div id="top" class="glass"><span id="ptitle"></span></div>
  <div id="bot" class="glass">
    <div id="pbar"><div id="pfill"></div></div>
    <div id="pinfo"><span id="ptime">0:00</span><span id="pdur">0:00</span></div>
    <div id="phint">◀ ▶ tua 10 giây (giữ để tua nhanh) · OK phát/dừng · ▲ ▼ tập trước/sau · Back thoát</div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.13/hls.min.js"></script>
<script>
if(/[?&]lite/.test(location.search))document.body.classList.add('lite');
const API='https://phimapi.com', IMG='https://phimimg.com/';
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const img=u=>!u?'':/^https?:/.test(u)?u:IMG+u.replace(/^\//,'');
const items=j=>j.items||(j.data&&j.data.items)||[];
async function get(p){const r=await fetch(API+p);if(!r.ok)throw new Error(r.status);return r.json();}
const store={get(k,d){try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const fmt=t=>{if(!isFinite(t))return'0:00';t=Math.floor(t);const h=Math.floor(t/3600),m=Math.floor(t%3600/60),s=t%60;return(h?h+':'+String(m).padStart(2,'0'):m)+':'+String(s).padStart(2,'0');};

const ROWS=[
  ['Mới cập nhật','/danh-sach/phim-moi-cap-nhat?page=1'],
  ['Phim bộ','/v1/api/danh-sach/phim-bo?page=1&limit=20'],
  ['Phim lẻ','/v1/api/danh-sach/phim-le?page=1&limit=20'],
  ['Hoạt hình','/v1/api/danh-sach/hoat-hinh?page=1&limit=20'],
  ['Anime Nhật Bản','/v1/api/danh-sach/hoat-hinh?page=1&limit=20&country=nhat-ban'],
  ['Hoạt hình Trung Quốc','/v1/api/danh-sach/hoat-hinh?page=1&limit=20&country=trung-quoc'],
  ['TV Shows','/v1/api/danh-sach/tv-shows?page=1&limit=20']
];
const TITLES={'phim-bo':'Phim bộ','phim-le':'Phim lẻ','hoat-hinh':'Hoạt hình','tv-shows':'TV Shows'};
const metaOf=m=>[m.origin_name,m.year,m.episode_current,m.lang].filter(Boolean).join(' · ');
const cardHTML=(m,r)=>`<div class="card" tabindex="0" data-slug="${esc(m.slug)}" data-r="${r==null?'':r}" data-bg="${esc(img(m.poster_url||m.thumb_url))}"><div class="pw"><img class="p" loading="lazy" src="${esc(img(m.thumb_url||m.poster_url))}" alt="">${m.quality?`<span class="qb">${esc(m.quality)}</span>`:''}${m.episode_current?`<span class="chip glass">${esc(m.episode_current)}</span>`:''}</div><div class="t">${esc(m.name)}</div><div class="y">${esc([m.year,m.lang].filter(Boolean).join(' · '))}</div></div>`;

/* ---------- nền ambient ---------- */
let bgT=null,bgCur='';
function setBg(u){if(!u||u===bgCur)return;bgCur=u;const b=$('#bg');b.style.opacity=.2;setTimeout(()=>{b.style.backgroundImage=`url("${u}")`;b.style.opacity=document.body.classList.contains('lite')?.3:.6;},180);}
document.addEventListener('focusin',e=>{
  const c=e.target.closest&&e.target.closest('.card,#banner');if(!c)return;
  clearTimeout(bgT);bgT=setTimeout(()=>setBg(c.dataset.bg),200);
});
document.addEventListener('mouseover',e=>{const t=e.target.closest&&e.target.closest('[tabindex]');if(t&&t!==document.activeElement&&$('#kb').hidden&&$('#player').hidden)t.focus({preventScroll:true});});

/* ---------- banner ---------- */
let BN=[],bi=0,bTimer=null;
function bannerShow(i){
  if(!BN.length)return;bi=(i+BN.length)%BN.length;const b=BN[bi],el=$('#banner'),im=$('#bimg');
  el.dataset.slug=b.slug;el.dataset.bg=img(b.poster_url||b.thumb_url);
  im.style.opacity=0;im.onload=()=>im.style.opacity=1;im.src=el.dataset.bg;
  $('#btitle').textContent=b.name;$('#bmeta').textContent=[b.origin_name,b.year,b.episode_current].filter(Boolean).join(' · ');
  $('#btags').innerHTML=[b.quality,b.lang,b.time].filter(Boolean).map(t=>`<span class="tag glass">${esc(t)}</span>`).join('');
  $('#dots').innerHTML=BN.map((_,k)=>`<span class="dot ${k===bi?'on':''}"></span>`).join('');
  if(document.activeElement===el)setBg(el.dataset.bg);
}
function bannerStart(){clearInterval(bTimer);bTimer=setInterval(()=>{if(!$('#home').hidden&&$('#player').hidden&&$('#kb').hidden)bannerShow(bi+1);},7000);}

/* ---------- điều hướng màn hình ---------- */
const stack=[];
const VIEWS=['home','list','detail'];
function show(id){VIEWS.forEach(v=>$('#'+v).hidden=v!==id);}
function curView(){return VIEWS.find(v=>!$('#'+v).hidden);}
function setNav(k){document.querySelectorAll('.nav[data-go]').forEach(n=>n.classList.toggle('on',n.dataset.go===k));}
function focusFirst(root){const e=root.querySelector('[tabindex]');if(e)e.focus({preventScroll:true});}

function renderCont(){
  const last=store.get('last',null),c=$('#cont');
  c.innerHTML=last?`<h2>Xem tiếp</h2><div class="track"><div class="card" tabindex="0" data-r="c" data-slug="${esc(last.slug)}" data-bg="${esc(img(last.bg||last.thumb))}"><div class="pw"><img class="p" src="${esc(img(last.thumb))}" alt=""><span class="chip glass">Tập ${esc(last.ep||'')}</span></div><div class="t">${esc(last.name)}</div><div class="y">Đang xem dở</div></div></div>`:'';
}
async function loadHome(){
  show('home');setNav('home');
  const h=$('#home');
  if(h.dataset.ok){renderCont();return;}
  $('#rows').innerHTML='<div id="msg">Đang tải...</div>';
  const res=await Promise.allSettled(ROWS.map(r=>get(r[1])));
  let html='';BN=[];
  res.forEach((r,i)=>{if(r.status==='fulfilled'){const it=items(r.value).slice(0,20);if(it.length){if(!BN.length)BN=it.filter(m=>m.poster_url).slice(0,6);html+=`<h2>${ROWS[i][0]}</h2><div class="track">${it.map(m=>cardHTML(m,i)).join('')}</div>`;}}});
  if(!html){$('#rows').innerHTML='<div id="msg">Không tải được dữ liệu. Kiểm tra mạng rồi thử lại.</div>';return;}
  $('#rows').innerHTML=html;h.dataset.ok=1;renderCont();
  if(BN.length){$('#banner').hidden=false;bannerShow(0);bannerStart();$('#banner').focus({preventScroll:true});setBg($('#banner').dataset.bg);}
  else focusFirst(h);
}

let L={kind:'',page:1,q:''};
const ANIME=[['all','Tất cả'],['nhat-ban','Anime Nhật Bản'],['trung-quoc','Trung Quốc'],['han-quoc','Hàn Quốc'],['au-my','Âu Mỹ']];
async function loadList(kind,q,append,country){
  show('list');
  const fromChip=country!==undefined;
  if(!append){
    L={kind,q,page:1,country:country&&country!=='all'?country:'',cf:country||'all'};
    $('#grid').innerHTML='';$('#lt').textContent=q?`Kết quả: ${q}`:TITLES[kind];setNav(q?'':kind);$('#list').scrollTop=0;
    $('#chips').innerHTML=(kind==='hoat-hinh'&&!q)?ANIME.map(a=>`<span class="ep glass ${a[0]===L.cf?'cur':''}" tabindex="0" data-cf="${a[0]}">${a[1]}</span>`).join(''):'';
  }
  else L.page++;
  const path=q?`/v1/api/tim-kiem?keyword=${encodeURIComponent(q)}&page=${L.page}&limit=24`:`/v1/api/danh-sach/${kind}?page=${L.page}&limit=24${L.country?'&country='+L.country:''}`;
  try{
    const j=await get(path),it=items(j);
    $('#grid').insertAdjacentHTML('beforeend',it.map(m=>cardHTML(m)).join(''));
    const pg=(j.data&&j.data.params&&j.data.params.pagination)||j.pagination||{};
    const tp=pg.totalPages||(pg.totalItems&&pg.totalItemsPerPage?Math.ceil(pg.totalItems/pg.totalItemsPerPage):L.page+(it.length>=24?1:0));
    $('#more').hidden=!(L.page<tp&&it.length);
    if(!it.length&&!append)$('#grid').innerHTML='<div id="msg">Không tìm thấy phim phù hợp.</div>';
    if(!append){const c=fromChip&&$('#chips [data-cf="'+L.cf+'"]');if(c)c.focus({preventScroll:true});else focusFirst($('#grid'));}
  }catch(e){$('#grid').insertAdjacentHTML('beforeend','<div id="msg">Lỗi tải danh sách.</div>');}
}

/* ---------- chi tiết ---------- */
let M=null,EPS=[],SV=0,EI=0;
async function openDetail(slug){
  stack.push({v:curView(),el:document.activeElement});show('detail');
  const d=$('#detail');d.innerHTML='<div id="msg">Đang tải...</div>';d.scrollTop=0;
  try{
    const j=await get('/phim/'+encodeURIComponent(slug));
    M=j.movie;EPS=(j.episodes||[]).filter(s=>s.server_data&&s.server_data.length);SV=0;EI=0;
    const last=store.get('last',null);
    if(last&&last.slug===slug){SV=Math.min(last.sv||0,Math.max(EPS.length-1,0));EI=last.ei||0;}
    setBg(img(M.poster_url||M.thumb_url));
    renderDetail();
  }catch(e){d.innerHTML='<div id="msg">Không tải được phim này. Bấm Back để quay lại.</div>';}
}
function renderDetail(){
  const m=M,d=$('#detail');
  const txt=String(m.content||'').replace(/<[^>]*>/g,'');
  const cur=EPS[SV]&&EPS[SV].server_data[EI];
  const servers=EPS.length>1?`<div class="eps">${EPS.map((s,i)=>`<span class="ep glass ${i===SV?'cur':''}" tabindex="0" data-sv="${i}">${esc(s.server_name)}</span>`).join('')}</div>`:'';
  const eps=EPS[SV]?EPS[SV].server_data.map((e,i)=>`<span class="ep glass ${i===EI?'cur':''}" tabindex="0" data-ei="${i}">${esc(e.name)}</span>`).join(''):'<div style="color:var(--mute)">Chưa có tập phim.</div>';
  d.innerHTML=`<div class="panel glass"><img src="${esc(img(m.thumb_url||m.poster_url))}" alt=""><div>
    <h1>${esc(m.name)}</h1><div class="meta">${esc([m.origin_name,m.year,m.quality,m.lang,m.episode_current,m.time].filter(Boolean).join(' · '))}</div>
    <div class="desc">${esc(txt)}</div><div style="margin-top:1.2rem">
    ${cur?`<span class="btn main" tabindex="0" id="playbtn">▶ Xem tập ${esc(cur.name)}</span>`:''}
    <span class="btn glass" tabindex="0" id="backbtn">Quay lại</span></div></div></div>
    <h2>Tập phim</h2>${servers}<div class="eps">${eps}</div>`;
  const b=$('#playbtn')||$('#backbtn');if(b)b.focus({preventScroll:true});
}

/* ---------- trình phát ---------- */
let hls=null,hudT=null,toastT=null,lastSave=0,seekAcc=0,seekT=null;
const V=()=>$('#v');
function hud(sticky){
  ['#top','#bot'].forEach(s=>$(s).classList.remove('hide'));clearTimeout(hudT);
  if(!sticky)hudT=setTimeout(()=>{if(!V().paused)['#top','#bot'].forEach(s=>$(s).classList.add('hide'));},3500);
}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.remove('hide');clearTimeout(toastT);toastT=setTimeout(()=>e.classList.add('hide'),900);}
const pkey=()=>`${M.slug}|${SV}|${EI}`;
function play(){
  const s=EPS[SV];if(!s)return;const e=s.server_data[EI];if(!e)return;
  const v=V(),emb=$('#emb');
  stop(true);$('#player').hidden=false;$('#pfill').style.width='0';$('#ptime').textContent='0:00';$('#pdur').textContent='0:00';
  $('#ptitle').textContent=`${M.name} — Tập ${e.name}`;hud();
  store.set('last',{slug:M.slug,name:M.name,thumb:M.thumb_url||M.poster_url,bg:M.poster_url,ep:e.name,sv:SV,ei:EI});
  const fallback=()=>{$('#spin').hidden=true;if(e.link_embed){v.hidden=true;emb.hidden=false;emb.src=e.link_embed;$('#phint').textContent='Đang dùng trình phát dự phòng. Bấm Back trên remote để thoát.';}else{$('#ptitle').textContent='Không phát được tập này. Bấm Back để chọn tập khác.';}};
  if(!e.link_m3u8){fallback();return;}
  v.hidden=false;emb.hidden=true;$('#spin').hidden=false;
  if(window.Hls&&Hls.isSupported()){
    hls=new Hls({maxBufferLength:40,enableWorker:true});hls.loadSource(e.link_m3u8);hls.attachMedia(v);
    hls.on(Hls.Events.ERROR,(_,d)=>{if(d.fatal){if(d.type===Hls.ErrorTypes.NETWORK_ERROR)hls.startLoad();else fallback();}});
    v.play().catch(()=>{});
  }else if(v.canPlayType('application/vnd.apple.mpegurl')){v.src=e.link_m3u8;v.play().catch(()=>{});}
  else fallback();
}
function stop(keep){
  const v=V(),emb=$('#emb');
  if(M&&v.currentTime>10)savePos();
  if(hls){hls.destroy();hls=null;}
  v.pause();v.removeAttribute('src');v.load();emb.src='about:blank';emb.hidden=true;$('#spin').hidden=true;
  if(!keep)$('#player').hidden=true;
}
function savePos(){const p=store.get('pos',{});p[pkey()]=V().currentTime;const k=Object.keys(p);if(k.length>200)delete p[k[0]];store.set('pos',p);}
function step(n){const t=EPS[SV].server_data.length,i=EI+n;if(i<0||i>=t){toast(n>0?'Đây là tập cuối':'Đây là tập đầu');return;}EI=i;play();}
(function bind(){
  const v=V();
  v.addEventListener('ended',()=>{const p=store.get('pos',{});delete p[pkey()];store.set('pos',p);if(EI+1<EPS[SV].server_data.length)step(1);else{stop();renderDetail();}});
  v.addEventListener('loadedmetadata',()=>{$('#pdur').textContent=fmt(v.duration);const p=store.get('pos',{})[pkey()];if(p>10&&p<v.duration-30){v.currentTime=p;toast('Tiếp tục từ '+fmt(p));}});
  v.addEventListener('timeupdate',()=>{
    if(v.duration)$('#pfill').style.width=(v.currentTime/v.duration*100)+'%';
    $('#ptime').textContent=fmt(v.currentTime);
    if(Date.now()-lastSave>5000&&v.currentTime>10){lastSave=Date.now();savePos();}
  });
  v.addEventListener('waiting',()=>$('#spin').hidden=false);
  v.addEventListener('playing',()=>{$('#spin').hidden=true;hud();});
  v.addEventListener('canplay',()=>$('#spin').hidden=true);
  v.addEventListener('pause',()=>hud(true));
  v.addEventListener('click',()=>{v.paused?v.play():v.pause();});
})();
function seek(dir,rep){
  const v=V();clearTimeout(seekT);seekAcc+=dir*(rep?30:10);
  v.currentTime=Math.max(0,Math.min(v.duration||1e9,v.currentTime+dir*(rep?30:10)));
  toast((seekAcc>0?'▶▶ +':'◀◀ ')+seekAcc+'s');hud();seekT=setTimeout(()=>seekAcc=0,1200);
}

/* ---------- bàn phím ảo ---------- */
let kq='';
const KEYS='ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789'.split('');
$('#keys').innerHTML=KEYS.map(k=>`<span class="key glass" tabindex="0" data-k="${k}">${k}</span>`).join('');
function kbOpen(){$('#kb').hidden=false;kq='';kbRender();$('#keys .key').focus();}
function kbClose(){$('#kb').hidden=true;$('#sbtn').focus({preventScroll:true});}
function kbRender(){const e=$('#kbq');e.textContent=kq||'Nhập tên phim...';e.classList.toggle('empty',!kq);}
function kbKey(k){
  if(k==='DEL')kq=kq.slice(0,-1);
  else if(k==='SPACE'){if(kq&&!kq.endsWith(' '))kq+=' ';}
  else if(k==='CLOSE'){kbClose();return;}
  else if(k==='GO'){const q=kq.trim();if(q){$('#kb').hidden=true;stack.length=0;loadList('',q);}return;}
  else kq+=k.toLowerCase();
  kbRender();
}

/* ---------- định tuyến hành động ---------- */
function goBack(){
  if(!$('#kb').hidden){kbClose();return;}
  if(!$('#player').hidden){stop();renderDetail();return;}
  const v=curView();
  if(v==='detail'){const p=stack.pop()||{v:'home'};show(p.v);if(p.v==='home')renderCont();if(p.el&&p.el.isConnected)p.el.focus({preventScroll:true});else focusFirst($('#'+p.v));return;}
  if(v==='list'){loadHome();}
}
function route(el){
  if(el.dataset.k!==undefined){kbKey(el.dataset.k);return true;}
  if(el.id==='sbtn'){kbOpen();return true;}
  if(el.dataset.go){stack.length=0;el.dataset.go==='home'?loadHome():loadList(el.dataset.go);return true;}
  if(el.classList.contains('card')||el.id==='banner'){openDetail(el.dataset.slug);return true;}
  if(el.dataset.cf!==undefined){loadList('hoat-hinh','',false,el.dataset.cf);return true;}
  if(el.id==='more'){loadList(L.kind,L.q,true);return true;}
  if(el.id==='playbtn'){play();return true;}
  if(el.id==='backbtn'){goBack();return true;}
  if(el.dataset.sv!==undefined){SV=+el.dataset.sv;EI=0;renderDetail();return true;}
  if(el.dataset.ei!==undefined){EI=+el.dataset.ei;play();return true;}
  return false;
}
document.addEventListener('click',e=>{const t=e.target.closest('[tabindex]');if(t)route(t);});

/* ---------- điều hướng bằng remote ---------- */
function focusables(){
  if(!$('#kb').hidden)return[...document.querySelectorAll('#kb [tabindex]')];
  return[...document.querySelectorAll('#bar [tabindex], .view:not([hidden]) [tabindex]')].filter(e=>e.offsetParent!==null);
}
function move(dir){
  const cur=document.activeElement,list=focusables();
  if(!cur||!list.includes(cur)){if(list[0])list[0].focus();return;}
  const c=cur.getBoundingClientRect(),cx=c.left+c.width/2,cy=c.top+c.height/2,horiz=dir==='ArrowLeft'||dir==='ArrowRight';
  let best=null,bs=1e9;
  for(const e of list){
    if(e===cur)continue;
    const r=e.getBoundingClientRect(),x=r.left+r.width/2,y=r.top+r.height/2,dx=x-cx,dy=y-cy;
    let p,s;
    if(horiz){if(Math.abs(dy)>Math.max(c.height,r.height)*.6)continue;p=dir==='ArrowRight'?dx:-dx;if(p<=4)continue;s=Math.abs(dy);}
    else{
      if(r.right<0||r.left>innerWidth)continue;
      p=dir==='ArrowDown'?dy:-dy;if(p<=4)continue;s=Math.abs(dx);
    }
    const sc=p+s*3;if(sc<bs){bs=sc;best=e;}
  }
  if(!best)return;
  best.focus({preventScroll:true});
  const view=best.closest('.view');
  if(best.closest('#bar')){const vv=curView();if(vv)$('#'+vv).scrollTop=0;}
  else if(best.dataset.r==='b'||best.dataset.r==='c'){view.scrollTop=0;if(best.dataset.r==='c')best.scrollIntoView({block:'nearest',inline:'center'});view.scrollTop=0;}
  else best.scrollIntoView({block:'center',inline:'center'});
}
const isBack=e=>e.key==='Escape'||e.key==='BrowserBack'||e.key==='GoBack'||e.key==='XF86Back'||e.keyCode===10009||e.keyCode===461||e.keyCode===27;
document.addEventListener('keydown',e=>{
  if(!$('#player').hidden){
    const v=V();
    if(isBack(e)||e.key==='Backspace'){e.preventDefault();goBack();return;}
    if(e.key==='ArrowRight'){e.preventDefault();seek(1,e.repeat);}
    else if(e.key==='ArrowLeft'){e.preventDefault();seek(-1,e.repeat);}
    else if(e.key==='ArrowUp'){e.preventDefault();step(-1);}
    else if(e.key==='ArrowDown'){e.preventDefault();step(1);}
    else if(e.key==='Enter'||e.key===' '||e.key==='MediaPlayPause'){e.preventDefault();if(v.paused){v.play();toast('▶');}else{v.pause();toast('❚❚');}}
    else if(e.key==='MediaPlay')v.play();else if(e.key==='MediaPause')v.pause();
    else hud();
    return;
  }
  if(!$('#kb').hidden){
    if(e.key==='Escape'){e.preventDefault();kbClose();return;}
    if(e.key==='Backspace'){e.preventDefault();kbKey('DEL');return;}
    if(e.key.length===1&&/[a-z0-9 ]/i.test(e.key)&&!e.ctrlKey&&!e.metaKey){e.preventDefault();kbKey(e.key===' '?'SPACE':e.key.toUpperCase());return;}
  }
  if(document.activeElement===$('#banner')&&(e.key==='ArrowLeft'||e.key==='ArrowRight')){e.preventDefault();bannerShow(bi+(e.key==='ArrowRight'?1:-1));bannerStart();return;}
  if(e.key.startsWith('Arrow')){e.preventDefault();move(e.key);}
  else if(e.key==='Enter'){const t=document.activeElement;if(t&&t.hasAttribute&&t.hasAttribute('tabindex')){e.preventDefault();route(t);}}
  else if(isBack(e)||e.key==='Backspace'){e.preventDefault();goBack();}
});
loadHome();
</script>
